name: Deploy TeleMed

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # AUTOMATED TEST STAGE
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run automated tests
        working-directory: ./backend
        run: npm test

      # =========================
      # DOCKER BUILD & PUSH
      # =========================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ranjit7399/telemed-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ranjit7399/telemed-frontend:latest

      # =========================
      # FA1 EC2 DEPLOYMENT
      # =========================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/TeleMed
            docker compose pull
            docker compose up -d
            docker image prune -f
      # =========================
      # KUBERNETES DEPLOYMENT
      # =========================
      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.K8S_HOST }}
          username: ubuntu
          key: ${{ secrets.K8S_SSH_KEY }}
          script: |
            kubectl set image deployment/telemed-backend \
              telemed-backend=ranjit7399/telemed-backend:latest \
              -n telemed

            kubectl set image deployment/telemed-frontend \
              telemed-frontend=ranjit7399/telemed-frontend:latest \
              -n telemed

            kubectl rollout status deployment/telemed-backend \
              -n telemed --timeout=180s

            kubectl rollout status deployment/telemed-frontend \
              -n telemed --timeout=180s

            kubectl get pods -n telemed